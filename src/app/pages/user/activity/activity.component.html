<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div class="card-title m-0">
      <img src="assets/images/icons/calendar.svg" class="mx-3" alt="birth-date icon">
      <h3 class="fw-bolder m-0">{{ userActivity[0].tripPaths[0].time | date:'d MMM y' }}</h3>
    </div>
    <div>
      <button type="button" class=" border-0 text-white d-flex gap-3" (click)="exportPDF()"
        style="background-color: #FF8B00; padding: 10px 24px; border-radius:8px;">
        <img src="assets/images/icons/prime_print.svg" alt="add-place">
        <span>طباعة</span>
      </button>
    </div>
  </div>


  <div class="card-body py-15">
    <div class="timeline-label">
      <div class="timeline-item" *ngFor="let item of userActivity">
        <div class="timeline-label fw-bolder text-gray-800 fs-6"></div>
        <div class="timeline-badge">
          <img [src]="item.classification | imagePipe" alt="mosque">
        </div>
        <div class="timeline-content d-flex flex-column px-10">
          <span class="text-gray-800 fs-4">{{item.placename}}</span>
          <span class="text-gray-500">تم الدخول في الساعه {{ item.tripPaths[0].time | date:'h:mm a' }}</span>
          <div class="card bg-light py-5 px-10 my-5 col-lg-8 flex-row justify-content-between align-items-center">
            <span class="text-gray-600">
              <img src="../../../../assets/images/icons/clock.svg" alt="clock">
              المده اللتى قضاها في المزار
              <span class="mx-3 text-gray-800">210دقيقه</span>
            </span>
            <span class="text-danger py-2 px-5 rounded-3" style="background-color: #e7c9c9;">أكثر من الطبيعي
              بكثير</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
