<div class="card">
  <div class="card-header border-0 pt-5 px-10 justify-content-between align-items-center">
    <h3 class="card-title m-0 text-gray-900 fs-3">
      إضافة مستخدم
    </h3>

    <h3 class="card-title m-0 text-gray-900 fs-3">

    </h3>
    <a class="text-gray-900 fs-6 form-label fs-3 d-flex align-items-center back-icon" routerLink="/users">عودة <i
        class="pi pi-angle-left fs-3"></i></a>
  </div>

  <div class="card-body border-0 p-9">
    <form class="form" [formGroup]="formGroup" (ngSubmit)="submit()">
      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">اسم الموظف</label>
        <input type="text" class="form-control" formControlName="fullName" required placeholder="اسم الموظف" />
        <div *ngIf="formGroup.get('fullName')?.invalid && formGroup.get('fullName')?.touched">
          <small class="text-danger">الاسم مطلوب</small>
        </div>
      </div>

      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" formControlName="email" placeholder="البريد الإلكتروني" />
        <div *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched">
          <small class="text-danger" *ngIf="formGroup.get('email')?.errors?.['required']">البريد الإلكتروني
            مطلوب</small>
          <small class="text-danger" *ngIf="formGroup.get('email')?.errors?.['email']">الرجاء إدخال بريد إلكتروني
            صالح</small>
        </div>
      </div>

      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">رقم الهوية</label>
        <input type="text" class="form-control" formControlName="identityNumber" required placeholder="رقم الهوية" />
        <!-- <div *ngIf="formGroup.get('identityNumber')?.invalid && formGroup.get('identityNumber')?.touched">
          <small class="text-danger">رقم الهوية مطلوب</small>
        </div> -->
        <div class="text-danger" *ngIf="
        formGroup.get('identityNumber')?.invalid &&
        formGroup.get('identityNumber')?.touched
      ">
          <small class="text-danger" *ngIf="formGroup.get('identityNumber')?.errors?.['required']">
            برجاء إدخال رقم الهوية.
          </small>
          <small class="text-danger" *ngIf="formGroup.get('identityNumber')?.errors?.['startError']">
            يجب أن يبدأ رقم الهوية بالرقم 1 أو 2.
          </small>
          <small class="text-danger" *ngIf="formGroup.get('identityNumber')?.errors?.['lengthError']">
            يجب أن يتكون رقم الهوية من 10 أرقام.
          </small>
        </div>
      </div>

      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">رقم الهاتف </label>
        <input type="text" class="form-control" formControlName="phoneNumber" required placeholder="رقم الهاتف" />
        <div *ngIf="formGroup.get('phoneNumber')?.invalid && formGroup.get('phoneNumber')?.touched">
          <small class="text-danger">رقم الهاتف مطلوب</small>
        </div>
      </div>

      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">الهيئة التابع لها</label>
        <select class="form-select" formControlName="dataSourceId" required>
          <option selected hidden value="">الهيئة التابع لها</option>
          <option *ngFor="let data of allDataSourse" [value]="data?.id">
            {{data?.name}}
          </option>
        </select>
        <div *ngIf="formGroup.get('dataSourceId')?.invalid && formGroup.get('dataSourceId')?.touched">
          <small class="text-danger">الهيئة مطلوبة</small>
        </div>
      </div>

      <div class="col-lg-12 fv-row mb-8">
        <label class="text-gray-900 fs-6 form-label">الدور</label>
        <select class="form-select" formControlName="roleName" required>
          <option value="" disabled selected>الدور</option>
          <option *ngFor="let data of roles" [value]="data?.value">
            {{data?.name}}
          </option>
        </select>
        <div *ngIf="formGroup.get('roleName')?.invalid && formGroup.get('roleName')?.touched">
          <small class="text-danger">الدور مطلوب</small>
        </div>
      </div>

      <div class="my-8">
        <label class="text-gray-900 fs-6 form-label">إضافة صورة شخصية</label>
        <div class="position-relative">
          <input type="file" class="form-control form-control-lg file1" required
            [ngClass]="{ 'text-white': !isFileSelected1 }" (change)="onFileSelected1($event)"
            accept=".jpg, .jpeg, .png, .webp, .svg">
          <span class="span-pic" *ngIf="!isFileSelected1">إضافة صورة شخصية</span>
        </div>
      </div>



      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-15">حفظ</button>
      </div>
    </form>
  </div>
</div>

<swal #successSwal [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم التحميل!" text=""
  icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>

<swal #successSwal2 [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }"
  title="تم إضافة مستخدم بنجاح!" text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>

<swal #erorr [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }"
  title="البريد الإلكتروني موجود بالفعل!" text="" icon="error" [customClass]="{confirmButton: 'btn btn-danger'}">
</swal>
