<div class="card mb-5 mb-xl-10">
  <div class="card-body pt-9 pb-0">
    <div class="d-flex flex-wrap flex-sm-nowrap mb-3">
      <div class="me-7 mb-4">
        <div class="
            symbol symbol-100px symbol-lg-160px symbol-fixed
            position-relative
          " *ngIf="user.profilePicture">
          <img [src]="user.profilePicture.startsWith('http') ? user.profilePicture : assets + user.profilePicture"
            alt="userImg" />
        </div>
        <div
          class="mx-5 font-bolder text-primary border-2 rounded-circle border d-flex justify-content-center align-items-center"
          style="width:100px; height:100px; font-size: 30px;" *ngIf="!user.profilePicture">{{ user.fullName | uppercase
          |
          slice:0:1 }}</div>
      </div>

      <div class="flex-grow-1">
        <div class="
            d-flex
            justify-content-between
            align-items-start
            flex-wrap
            mb-2
          ">
          <div class="d-flex flex-column">
            <div class="d-flex align-items-center mb-2">
              <a class="
                  text-gray-800 text-hover-primary
                  fs-2
                  me-1
                  cursor-pointer
                ">
                {{user?.fullName}}
              </a>
            </div>

            <div class="d-flex flex-wrap fs-6 mb-4 gap-4">
              <a class="
                  d-flex
                  align-items-center
                  text-gray-500 text-hover-primary
                  mb-2
                  cursor-pointer
                ">
                <app-keenicon name="sms" class="fs-4"></app-keenicon>
                {{user?.email}}
              </a>
            </div>
          </div>
        </div>

        <div class="d-flex flex-wrap flex-stack">
          <div class="d-flex flex-column flex-grow-1 pe-8">
            <div class="d-flex flex-wrap">
              <div class="
                  border border-gray-300 border-dashed
                  rounded
                  min-w-125px
                  py-3
                  px-4
                  me-6
                  mb-3
                ">
                <div class="d-flex align-items-center">
                  <div class="fs-2">{{userDetails?.userPlaces?.length}}</div>
                </div>

                <div class="fs-6 text-gray-500">مزار سياحي</div>
              </div>
              <div class="
                  border border-gray-300 border-dashed
                  rounded
                  min-w-125px
                  py-3
                  px-4
                  me-6
                  mb-3
                ">
                <div class="d-flex align-items-center">
                  <div class="fs-2">{{userDetails?.userActivity?.length}}</div>
                </div>

                <div class="fs-6 text-gray-500">فعاليات</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex overflow-auto h-55px">
      <ul class="
          nav nav-stretch nav-line-tabs nav-line-tabs-2x
          border-transparent
          fs-5
          flex-nowrap
        ">
        <li class="nav-item">
          <a class="nav-link text-active-primary me-6" routerLink="profile" routerLinkActive="active">
            الحساب
          </a>
        </li>
        <li class="nav-item" *ngIf="user?.roles?.includes('Tourist')">
          <a class="nav-link text-active-primary me-6" routerLink="userPlaces" routerLinkActive="active">
            المزارات
          </a>
        </li>

        <li class="nav-item" *ngIf="user?.roles?.includes('Tourist')">
          <a class="nav-link text-active-primary me-6" routerLink="activity" routerLinkActive="active">
            نشاطه</a>
        </li>
      </ul>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
