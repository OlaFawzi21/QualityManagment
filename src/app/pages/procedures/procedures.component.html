<section>
    <div class="d-flex justify-content-between align-items-center mb-10">
        <div class="d-flex align-items-center gap-5">
            <span class="text-primary fs-3">{{ title }}</span>
            <p-iconField iconPosition="right">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="search" class="w-md-400px w-sm-300px" pInputText placeholder="ابحث هنا" />
            </p-iconField>
        </div>
        <button type="button" class="btn second-color d-flex gap-2 align-items-center" (click)="exportPDF()">
            <i class="bi bi-box-arrow-down text-white p-0"></i>
            <span>تصدير</span>
        </button>
    </div>

    <div class="d-flex align-items-center gap-3 flex-wrap">
        <button type="button" class="btn second-color d-flex gap-3" data-action="create"
            [routerLink]="['/procedures/addProcedure']">
            <img src="assets/images/icons/add-user.svg" alt="add-user" />
            <span>إضافة إجراء </span>
        </button>
        <div class="min-w-200px">
            <p-dropdown [options]="management" [(ngModel)]="selectedManagement" optionLabel="name"
                placeholder="الإدارة" />
        </div>
        <div class="min-w-200px">
            <p-dropdown [options]="department" [(ngModel)]="selectedDepartment" optionLabel="name"
                placeholder="القسم" />
        </div>
    </div>

    <div class="table-responsive">
        <div class="table-responsive mt-5">
            <table class="table align-middle gs-0 gy-4">
                <thead>
                    <tr class="text-gray-600 bg-gray-300">
                        <th class="min-w-125px">#</th>
                        <th class="min-w-125px">اسم الإجراء</th>
                        <th class="min-w-125px">مسلسل</th>
                        <th class="min-w-125px">الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="text-primary">
                        <td>200</td>
                        <td>تنظيم مواقف السيارات بالمجمعات الطبيه</td>
                        <td>الاداره التنفيذيه للمشروعات</td>
                        <td>
                            <div class="dropdown">
                                <button class="btn dropdown-toggle px-2 p-0" type="button" id="actionsDropdown"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots text-primary p-0 fs-4"></i>
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="actionsDropdown">
                                    <li>
                                        <button class="dropdown-item py-2" [routerLink]="['editProcedure', '1']">
                                            <div class="d-flex gap-3">
                                                <div>
                                                    <i class="bi bi-pencil-square text-primary"></i>
                                                </div>
                                                <div class="ext-primary">تعديل</div>
                                            </div>
                                        </button>
                                    </li>
                                    <!-- <li>
                                        <button class="dropdown-item py-2" routerLink="jobTitleDetail">
                                            <div class="d-flex gap-3">
                                                <div >
                                                    <i class="bi bi-eye text-primary"></i>
                                                </div>
                                                <div class="ext-primary">عرض</div>
                                            </div>
                                        </button>
                                    </li> -->
                                    <li>
                                        <button class="dropdown-item py-2" routerLink="signatureLog">
                                            <div class="d-flex gap-3">
                                                <div>
                                                    <i class="bi bi-file-earmark-text text-primary"></i>
                                                </div>
                                                <div class="ext-primary">سجل التوقيع</div>
                                            </div>
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item py-2" (click)="openModal(formModal)">
                                            <div class="d-flex gap-3">
                                                <div>
                                                    <i class="bi bi-envelope-arrow-up text-primary"></i>
                                                </div>
                                                <div class="ext-primary">
                                                    إرسال في بريد إلكتروني
                                                </div>
                                            </div>
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item py-2" (click)="showDeleteSec=true;">
                                            <div class="d-flex gap-3">
                                                <div>
                                                    <i class="bi bi-ban text-danger"></i>
                                                </div>
                                                <div class="text-danger">حذف</div>
                                            </div>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- delete section -->
        <div class="bg-danger px-4 py-3 d-flex justify-content-between align-items-center" *ngIf="showDeleteSec">
            <span class="text-white fs-6">سيتم حذف الوظيفه ( مدير تشغيل )</span>
            <div>
                <button type="button" class="btn btn-secondary mx-3" (click)="showDeleteSec=false;">
                    إلغاء
                </button>
                <button type="submit" class="btn second-color ">
                    تأكيد
                </button>
            </div>
        </div>

        <div class="paginator-div d-flex justify-content-center align-items-center">
            <p-paginator [totalRecords]="totalRecords" (onPageChange)="onPageChange($event)" [first]="first"
                [rows]="rows" [rowsPerPageOptions]="[10, 25, 50, 100]" />
        </div>
    </div>
</section>

<ng-template #formModal let-modal>
    <form [formGroup]="mailForm" (ngSubmit)="sendMail()">
        <div class="modal-header border-0">
            <h4 class="modal-title fw-normal text-primary">إرسال عبر البريد الإلكتروني</h4>
        </div>

        <div class="modal-body py-0">
            <div class="d-flex flex-column mw-650px" id="kt_modal_update_customer_scroll">
                <div class="mb-5">
                    <label class="text-gray-900 fs-6 form-label">البريد الإلكتروني</label>
                    <input type="text" class="form-control" formControlName="email" />
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required',
              message: 'برجاء إدخال البريد الإلكتروني ',
              control: mailForm.controls['email']
            }"></ng-container>
                </div>
            </div>
        </div>

        <div class="modal-footer flex-end border-0">
            <button type="button" class="btn btn-secondary py-2" ngbAutofocus (click)="modal.dismiss('Cross click')">
                <span class="indicator-label">إغلاق</span>
            </button>
            <button type="submit" class="btn btn-primary py-2" [attr.data-kt-indicator]="isLoading ? 'on' : 'off'">
                <span class="indicator-label">إرسال</span>
                <span class="indicator-progress">
                    يرجى الانتظار...
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
            </button>
        </div>
    </form>
</ng-template>

<!--control error msg -->
<ng-template #formError let-control="control" let-message="message" let-validation="validation">
    <ng-container *ngIf="
      control.hasError(validation) &&
      (control.dirty || (control.touched && control.errors))
    ">
        <div class="fv-plugins-message-container">
            <span class="text-danger" role="alert">
                {{ message }}
            </span>
        </div>
    </ng-container>
</ng-template>
