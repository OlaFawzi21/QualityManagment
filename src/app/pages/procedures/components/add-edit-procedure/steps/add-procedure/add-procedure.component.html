<div class="card">

    <div class="card-body border-0">
        <form class="form" [formGroup]="formGroup" (ngSubmit)="submitPlace()">
            <p-stepper [linear]="true">
                <!-- 1 -->
                <p-stepperPanel>
                    <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
                        <div class="d-flex flex-column">

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">اسم الاجراء</label>
                                </div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedureName"
                                        placeholder="اسم الاجراء" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">اسم الاجراء (EN)</label>
                                </div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedureNameEn"
                                        placeholder="اسم الاجراء (EN)" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">رقم الاجراء</label>
                                </div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedureNumber"
                                        placeholder="رقم الاجراء" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">الاداره</label>
                                </div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="department" placeholder="الإدارة" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">القسم</label>
                                </div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="section" placeholder="القسم" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2">
                                    <label class="form-label">الشعبة</label>
                                </div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="division" placeholder="الشعبة" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">تاريخ الاصدار</label></div>
                                <div class="col-lg-10">
                                    <p-calendar [showIcon]="true" formControlName="issueDate" dateFormat="yy-mm-dd">
                                    </p-calendar>
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">التكرار</label></div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="frequency" placeholder="التكرار" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">مكان تنفيذ الاجراء</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="executionPlace"
                                        placeholder="مكان تنفيذ الاجراء" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">مكان تنفيذ الاجراء (EN)</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="executionPlaceEn"
                                        placeholder="مكان تنفيذ الاجراء (EN)" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">المستفيدين</label></div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="beneficiaries" placeholder="المستفيدين" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">المستفيدين (EN)</label></div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="beneficiariesEn" placeholder="المستفيدين (EN)" />
                                </div>
                            </div>
                        </div>

                        <div class="d-flex pt-4 justify-content-end">
                            <p-button label="التالي" iconPos="right" (onClick)="nextCallback.emit();" />
                        </div>
                    </ng-template>
                </p-stepperPanel>


                <!-- 2 -->
                <p-stepperPanel>
                    <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback">
                        <div class="d-flex flex-column">
                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">مزودي الخدمة</label></div>
                                <div class="col-lg-10">
                                    <p-dropdown [options]="governments" optionLabel="name" optionValue="id"
                                        formControlName="serviceProviders" placeholder="مزودي الخدمة" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">آخر تحديث على الإجراء</label></div>
                                <div class="col-lg-10">
                                    <p-calendar [showIcon]="true" formControlName="lastUpdate" dateFormat="yy-mm-dd">
                                    </p-calendar>
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">تاريخ التفعيل</label></div>
                                <div class="col-lg-10">
                                    <p-calendar [showIcon]="true" formControlName="activationDate"
                                        dateFormat="yy-mm-dd">
                                    </p-calendar>
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">تاريخ المراجعة</label></div>
                                <div class="col-lg-10">
                                    <p-calendar [showIcon]="true" formControlName="reviewDate" dateFormat="yy-mm-dd">
                                    </p-calendar>
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">نشر الإجراء</label></div>
                                <div class="col-lg-10">
                                    <p-inputSwitch formControlName="publishProcedure" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">الوقت المستغرق لتنفيذ الإجراء</label>
                                </div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="executionDuration"
                                        placeholder="الوقت المستغرق" />
                                </div>
                            </div>
                        </div>

                        <div class="d-flex pt-4 justify-content-between">
                            <p-button label="السابق" (onClick)="prevCallback.emit()" />
                            <p-button label="التالي" iconPos="right" (onClick)="nextCallback.emit()" />
                        </div>
                    </ng-template>
                </p-stepperPanel>


                <!-- 3 -->
                <p-stepperPanel>
                    <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                        let-index="index">
                        <div class="d-flex flex-column">
                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">إعداد الإجراء</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedurePreparation"
                                        placeholder="إعداد الإجراء" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">معتمد الإجراء</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="approver"
                                        placeholder="معتمد الإجراء" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">المراجعة بواسطة</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="reviewedBy"
                                        placeholder="المراجعة بواسطة" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">وصف الاجراء والهدف منه</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedureDescription"
                                        placeholder="وصف الاجراء والهدف منه" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">وصف الاجراء والهدف منه (EN)</label>
                                </div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="procedureDescriptionEn"
                                        placeholder="وصف الاجراء والهدف منه (EN)" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">وصف المدخل</label></div>
                                <div class="col-lg-10">
                                    <input class="form-control" formControlName="inputDescription"
                                        placeholder="وصف المدخل" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">وصف المدخل (EN)</label></div>
                                <div class="col-lg-10">
                                    <input type="text" class="form-control" formControlName="inputDescriptionEn" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">المخرجات</label></div>
                                <div class="col-lg-10">
                                    <input type="text" class="form-control" formControlName="outputs" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">المخرجات (EN)</label></div>
                                <div class="col-lg-10">
                                    <input type="text" class="form-control" formControlName="outputsEn" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">تطوير الاجراء لينفذ الكترونيا</label>
                                </div>
                                <div class="col-lg-10">
                                    <p-inputSwitch formControlName="eProcedureDevelopment" />
                                </div>
                            </div>

                            <div class="row mb-8">
                                <div class="col-lg-2"><label class="form-label">هل الاجراء العام</label></div>
                                <div class="col-lg-10">
                                    <p-inputSwitch formControlName="generalProcedure" />
                                </div>
                            </div>

                        </div>

                        <div class="d-flex pt-4 justify-content-between">
                            <p-button label="السابق" (onClick)="prevCallback.emit()" />
                            <p-button label="حفظ" type="submit" />
                        </div>
                    </ng-template>
                </p-stepperPanel>
            </p-stepper>
        </form>
    </div>
</div>

<swal #deleteSwal [swalOptions]="swalOptions" title="حدث خطأ!" icon="error"
    [customClass]="{ confirmButton: 'btn btn-danger' }" [showCancelButton]="false">
</swal>
