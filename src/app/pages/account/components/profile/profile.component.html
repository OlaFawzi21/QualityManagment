<div class="card mt-15">
    <div class="card-body p-10">
        <form [formGroup]="myForm" (ngSubmit)="submitForm()">
            <div class="row align-items-center g-3 mb-8">
                <div class="col-lg-2">
                    <label class="fs-6 text-gray-800">الصورة</label>
                </div>
                <div class="col-lg-8 position-relative symbol symbol-100px symbol-lg-160px rounded-3 overflow-hidden">
                    <input type="file" id="profilePicture" (change)="onFileSelected($event)"
                        accept=".jpg, .jpeg, .png, .webp, .svg" hidden />
                    <label for="profilePicture" class="cursor-pointer">
                        <img [src]="profileImage" alt="userImg" width="100" height="100" />
                    </label>
                    <label for="profilePicture"
                        class="pen-icon position-absolute bottom-0 end-0 bg-white p-2 rounded-circle shadow-sm">
                        <i class="bi bi-pencil-fill text-primary"></i>
                    </label>
                </div>
            </div>

            <div class="row align-items-center g-3 mb-8">
                <div class="col-lg-2">
                    <label class="fs-6 text-gray-800">الإسم بالكامل</label>
                </div>
                <div class="col-lg-8 position-relative">
                    <input type="text" class="form-control" formControlName="fullName" placeholder="الإسم بالكامل" />
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'الاسم مطلوب',
                    control: myForm.controls['fullName']
                    }"></ng-container>
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'minlength',
                    message: 'يجب أن يكون الاسم مكونًا من 4 أحرف على الأقل',
                    control: myForm.controls['fullName']
                    }"></ng-container>
                </div>
            </div>

            <div class="row align-items-center g-3 mb-8">
                <div class="col-lg-2">
                    <label class="fs-6 text-gray-800">رقم الهاتف</label>
                </div>
                <div class="col-lg-8 position-relative">
                    <input type="number" class="form-control" formControlName="phoneNumber" placeholder="رقم الهاتف" />
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'رقم الهاتف مطلوب',
                    control: myForm.controls['phoneNumber']
                    }"></ng-container>
                </div>
            </div>

            <!-- <div class="row align-items-center g-3 mb-8">
                <div class="col-lg-2">
                    <label class="fs-6 text-gray-800"></label>
                </div>
                <div class="col-lg-8 position-relative">
                    <input type="email" class="form-control" formControlName="email" placeholder="البريد الإلكتروني" />
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'البريد الإلكتروني مطلوب',
                    control: myForm.controls['email']
                    }"></ng-container>
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'pattern',
                    message: 'البريد الإلكتروني غير صالح',
                    control: myForm.controls['email']
                    }"></ng-container>
                </div>
            </div> -->

            <div class="row align-items-center g-3 mb-8">
                <div class="col-lg-2">
                    <label class="fs-6 text-gray-800">اللغة</label>
                </div>
                <div class="col-lg-8">
                    <p-dropdown [options]="nations" formControlName="NationalityId" placeholder="اختر اللغة"
                        optionLabel="name" optionValue="id" [filter]="true">
                        <ng-template let-place pTemplate="item">
                            <div class="d-flex align-items-center">
                                <img [src]="place.flag" alt="{{ place.name }}" class="me-2"
                                    style="width: 20px; height: 15px;" />
                                <span>{{ place.name }}</span>
                            </div>
                        </ng-template>
                    </p-dropdown>
                    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                        validation: 'required',
                        message: 'اللغة مطلوبة',
                        control: myForm.controls['NationalityId']
                        }">
                    </ng-container>
                </div>
            </div>

            <div class="col-lg-10 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary px-15" [disabled]="myForm.invalid">
                    <span>حفظ التغييرات</span>
                    <span *ngIf="isLoading">
                        يرجى الانتظار...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>


<!--control error msg -->
<ng-template #formError let-control="control" let-message="message" let-validation="validation">
    <ng-container *ngIf="
        control.hasError(validation) &&
        (control.dirty || (control.touched && control.errors))
        ">
        <div class="fv-plugins-message-container">
            <span class="text-danger" role="alert">
                {{ message }}
            </span>
        </div>
    </ng-container>
</ng-template>
