<div class="card">
    <div class="card-header border-0 pt-5 px-10 justify-content-between align-items-center">
        <div class="card-title m-0 align-items-start flex-column">
            <span class="mb-3 text-gray-900 fs-3">إضافة وسائل التنقل</span>
        </div>
        <a class="text-gray-900 fs-3 d-flex align-items-center back-icon" routerLink="/reports">عودة <i
                class="pi pi-angle-left fs-3"></i></a>
    </div>

    <div class="card-body pt-5 pb-0 px-10">
        <form class="form" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-lg-4 fv-row mb-8">
                    <p-dropdown [options]="cities" formControlName="selectedReport" placeholder="اختر نوع التقرير" />
                </div>
                <div class="col-lg-4 fv-row mb-8">
                    <input type="text" placeholder="اسم وسيلة النقل" class="form-control"
                        formControlName="selectedTrans">
                </div>
                <div class="col-lg-4 fv-row mb-8">
                    <p-dropdown [options]="cities" formControlName="selectedNation" placeholder="اختر الجنسيه" />
                </div>
            </div>

            <div class="row">
                <div class="col-lg-2 col-6 fv-row mb-8">
                    <p-calendar formControlName="formDate" [showIcon]="true" [showTime]="true" placeholder="من"
                        inputId="icondisplay"></p-calendar>
                </div>
                <div class="col-lg-2 col-6 fv-row mb-8">
                    <p-calendar formControlName="formDate" [showIcon]="true" [showTime]="true" placeholder="إلي"
                        inputId="icondisplay"></p-calendar>

                </div>
                <div class="col-lg-4 fv-row mb-8">
                    <p-dropdown [options]="cities" formControlName="selectedHeritage" placeholder="نوع المزار" />
                </div>
                <div class="col-lg-4 fv-row mb-8">
                    <p-dropdown [options]="cities" formControlName="selectedPlace" placeholder="المزارات السياحية" />
                </div>
            </div>

            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary px-15">
                    <span *ngIf="!isLoading">إنشاء تقرير</span>
                    <span *ngIf="isLoading">
                        يرجى الانتظار...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </button>
            </div>
        </form>

        <div class="d-flex overflow-auto h-55px">
            <ul class="
                nav nav-stretch nav-line-tabs nav-line-tabs-2x
                border-transparent
                fs-5
                flex-nowrap
                ">
                <li class="nav-item">
                    <a class="nav-link text-active-primary me-6" routerLink="public-safety"
                        routerLinkActive="active">
                        تقييم السلامة العامة
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-active-primary me-6" routerLink="emergency-notifications" routerLinkActive="active">
                        إشعارات الطوارئ و الإستجابة
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-active-primary me-6" routerLink="visitor-traffic-tracking"
                        routerLinkActive="active">
                        تتبع و تحليل حركة الزوار
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>

<router-outlet></router-outlet>
