          <div>
            <label class="text-gray-900 fs-6 form-label">سبب الحظر</label>
            <textarea class="form-control" [formControl]="block" rows="3"></textarea>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                validation: 'required',
                message: 'برجاء ادخال سبب الحظر',
                control: block
              }"></ng-container>
          </div>
        </div>
      </div>
  
      <div class="modal-footer flex-end border-0">
        <button type="button" class="btn btn-secondary py-2" ngbAutofocus (click)="modal.dismiss('Cross click')">
          <span class="indicator-label">إغلاق</span>
        </button>
        <button type="submit" class="btn btn-primary py-2" [attr.data-kt-indicator]="isLoading ? 'on' : 'off'">
          <span class="indicator-label">إرسال</span>
          <span class="indicator-progress">
            يرجى الانتظار...
            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
          </span>
        </button>
      </div>
    </form>
  </ng-template>
  
  <ng-template #formModal2 let-modal>
    <form [formGroup]="noticeForm" (ngSubmit)="noticeUser()">
      <div class="modal-header border-0">
        <h4 class="modal-title fw-normal text-primary">إشعار المستخدم</h4>
      </div>
  
      <div class="modal-body py-0">
        <div class="d-flex flex-column mw-650px" id="kt_modal_update_customer_scroll">
          <div class="mb-5">
            <label class="text-gray-900 fs-6 form-label">العنوان</label>
            <input type="text" class="form-control" formControlName="title" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                validation: 'required',
                message: 'برجاء ادخال العنوان ',
                control: noticeForm.controls['title']
              }"></ng-container>
          </div>
          <div class="mb-5">
            <label class="text-gray-900 fs-6 form-label">المحتوي</label>
            <textarea class="form-control" formControlName="content" rows="3"></textarea>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                validation: 'required',
                message: 'برجاء ادخال المحتوي ',
                control: noticeForm.controls['content']
              }"></ng-container>
          </div>
          <div class="mb-5 d-flex gap-5">
            <label class="text-gray-900 fs-6 form-label">رسالة نصية</label>
            <p-inputSwitch formControlName="msg" />
          </div>
          <div class="d-flex gap-5">
            <label class="text-gray-900 fs-6 form-label">النظام</label>
            <p-inputSwitch formControlName="system" />
          </div>
        </div>
      </div>
  
      <div class="modal-footer flex-end border-0">
        <button type="button" class="btn btn-secondary py-2" ngbAutofocus (click)="modal.dismiss('Cross click')">
          <span class="indicator-label">إغلاق</span>
        </button>
        <button type="submit" class="btn btn-primary py-2" [attr.data-kt-indicator]="isLoading ? 'on' : 'off'">
          <span class="indicator-label">إرسال</span>
          <span class="indicator-progress">
            يرجى الانتظار...
            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
          </span>
        </button>
      </div>
    </form>
  </ng-template>
  
  <!--control error msg -->
  <ng-template #formError let-control="control" let-message="message" let-validation="validation">
    <ng-container *ngIf="
        control.hasError(validation) &&
        (control.dirty || (control.touched && control.errors))
      ">
      <div class="fv-plugins-message-container">
        <span class="text-danger" role="alert">
          {{ message }}
        </span>
      </div>
    </ng-container>
  </ng-template>
