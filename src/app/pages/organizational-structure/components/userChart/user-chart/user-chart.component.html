<div class="d-flex justify-content-between align-items-center mb-10">
  <div class="d-flex align-items-center gap-5">
    <span class="text-primary fs-3">المستخدمين</span>
  </div>
  <button type="button" class="btn second-color d-flex gap-2 align-items-center">
    <i class="bi bi-box-arrow-down text-white p-0"></i>
    <span>تصدير</span>
  </button>
</div>
<div class="card border-0 shadow-none flex justify-content-center">
  <p-organizationChart [value]="data" selectionMode="multiple" [collapsible]="true">
    >
    <ng-template let-node pTemplate="default">
      <div class="text-center">
        <div class="second-color font-bold p-2">
          {{ node.data.name }}
        </div>
        <div class="title d-flex justify-content-center align-items-center">
          <span class="">
            {{ node.data.title }}
          </span>
        </div>
      </div>
    </ng-template>
  </p-organizationChart>
</div>
