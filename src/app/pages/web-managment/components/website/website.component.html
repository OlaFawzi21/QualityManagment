<div class="card mb-12">
  <div class="card-header border-0 pt-5 px-10 justify-content-between align-items-center">
    <h3 class="card-title m-0 text-gray-900 fs-3">
      الصفحة الرئيسية
    </h3>
  </div>

  <div class="card-body border-0 p-9">
    <form class="form" [formGroup]="websiteFormGroup" (ngSubmit)="submitForm()">
      <div class="col-lg-12 fv-row mb-8">
        <input type="text" formControlName="titleAr" class="form-control form-control-lg" placeholder="العنوان"
          name="name" />
      </div>

      <p-editor formControlName="descriptionAr" [style]="{ height: '320px'}" />


      <div class="my-8 ">
        <label class="text-gray-900 fs-4 mb-2"> إضافة شريحة</label>
        <div class="mb-6 position-relative">
          <input type="file" class="form-control form-control-lg file1" [ngClass]="{ 'text-color': !isFileSelected1 }"
            (change)="onImagesSelected($event)" accept=".jpg, .jpeg, .png, .webp, .svg, video/mp4">
          <span class="span-pic fs-5" *ngIf="!isFileSelected1">إضافة شريحة</span>
        </div>
      </div>

      <div class="mb-8" *ngIf="url">
        <div class="rounded-3 overflow-hidden position-relative mx-auto" style="width: 100%;height: 100%;"
          *ngIf="url.split('.').pop() === 'mp4'">
          <video [src]="url" class="w-100" controls></video>
          <a class="position-absolute px-2 pt-1 text-black rounded-circle cursor-pointer"
            style="left:5px; top:5px; background-color: rgba(238, 238, 238, 0.741);" (click)="this.url='';">
            <i class="pi pi-times fs-8"></i>
          </a>
        </div>
        <div class="rounded-3 overflow-hidden position-relative mx-auto" style="width: 100%;height: 100%;"
          *ngIf="url.split('.').pop() !== 'mp4'">
          <img [src]="url" class="w-100 h-100" alt="img">
          <a class="position-absolute px-2 pt-1 text-black rounded-circle cursor-pointer"
            style="left:10px; top:5px; background-color: rgba(238, 238, 238, 0.741);" (click)="url='';">
            <i class="pi pi-times fs-8"></i>
          </a>
        </div>
      </div>

      <div class="col-lg-12 fv-row my-8">
        <label class="text-gray-900 fs-6 form-label">الموقع الاثري</label>
        <select class="form-select" formControlName="placeId" required>
          <option [value]="null" disabled selected>اختر الموقع الاثري</option>
          <option [value]="+place.id" *ngFor="let place of attractionPlaces">{{place.name}}</option>
        </select>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-15">حفظ</button>
      </div>
    </form>
    <div class="mt-10">
      <!--begin::According-->
      <div class="">
        <p-accordion>
          <div class="row align-items-center flex-nowrap" *ngFor="let data of data; let i = index">
            <div class="col-11">
              <p-accordionTab [header]="data.title">
                <!-- <img [src]="assets+data.url" class="img-thumbnail"> -->
                <img *ngIf="!data.url.includes('.mp4')" [src]="assets + data.url" class="img-thumbnail w-100">
                <!-- عرض فيديو إذا كان الملف MP4 -->
                <video *ngIf="data.url.includes('.mp4')" class="w-100" controls>
                  <source [src]="assets + data.url" type="video/mp4">
                  متصفحك لا يدعم تشغيل الفيديو.
                </video>
                <p class="text-gray-900 fs-2">{{data.description}}</p>
              </p-accordionTab>
            </div>
            <div class="dropdown actions text-start mx-4 col-1">
              <button class="btn dropdown-toggle actions-button py-3 px-5" type="button" id="actionsDropdown"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-ellipsis-v p-0" style="color:#979797;"></i>
              </button>
              <ul class="dropdown-menu" aria-labelledby="actionsDropdown">
                <li>
                  <button class="dropdown-item" (click)="removeData(data.sliderId)">
                    <div class="row justify-content-start gap-2">
                      <div class="col-2">
                        <i class="bi bi-trash" style="color: red;"></i>
                      </div>
                      <div class="col-4">مسح</div>
                    </div>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </p-accordion>
      </div>
      <!--end::According-->
    </div>
  </div>
</div>
<div class="card">
  <div class="card-header border-0 pt-5 px-10 justify-content-between align-items-center">
    <h3 class="card-title m-0 text-gray-900 fs-3">
      تحميل تطبيق الجوال
    </h3>
  </div>

  <div class="card-body border-0 p-9">
    <form class="form mb-10" [formGroup]="mobileFormGroup" (ngSubmit)="submitMobileForm()">
      <div class="col-lg-12 fv-row mb-8">
        <input type="text" formControlName="titleAr" class="form-control form-control-lg" placeholder="العنوان"
          name="name" />
      </div>
      <div class="mob">
        <p-editor [style]="{ height: '320px'}" (onInit)="setPlaceholder()" formControlName="descriptionAr" />
      </div>

      <div class="my-8 ">
        <div class="mb-6 position-relative">
          <input type="file" class="form-control form-control-lg file1" [ngClass]="{ 'text-color': !isFileSelected2 }"
            [ngClass]="{ 'text-white': isFileSelected2 }" (change)="onFileSelected2($event)"
            accept=".jpg, .jpeg, .png, .webp, .svg, video/mp4">
          <span class="span-pic fs-5" *ngIf="!isFileSelected2">إرفاق صورة</span>
          <span class="span-pic fs-5" *ngIf="isFileSelected2">{{imageName}}</span>
        </div>
        <!-- <div class="my-3" *ngIf="abouHail.image">
          <img [src]="assets+abouHail.image" alt="الصورة المحملة" class="img-thumbnail" width="150">
        </div> -->
      </div>
      <div class="my-8">
        <div [formGroup]="socialMediaForm">
          <div formArrayName="socialMedia">
            <label class="text-gray-900 fs-4">وسائل التواصل الإجتماعي</label>
            <div *ngFor="let contact of socialMedia.controls; let i = index" [formGroupName]="i"
              class="form-group align-items-center row w-100 mt-3">
              <!-- اسم المؤشر الجزئي -->
              <div class="col-md-9">
                <div class="row">
                  <div class="col-12 mb-3">
                    <input type="text" formControlName="linkName" class="form-control mb-2 mb-md-0"
                      placeholder="الإسم" />
                  </div>
                  <div class="col-12">
                    <input type="text" formControlName="linkUrl" class="form-control mb-2 mb-md-0"
                      placeholder="الرابط" />
                  </div>
                </div>
              </div>
              <!-- حذف مؤشر جزئي  -->
              <div class="col-md-3">
                <button type="button" class="btn btn-sm btn-light-danger w-100 mt-3 mt-md-9 py-3"
                  (click)="removeContact(i)">
                  <i class="fa-solid fa-trash fs-5"></i>
                  حذف
                </button>
              </div>
            </div>
          </div>
          <!-- اضافة مؤشر جزئي جديد -->
          <div class="form-group mt-5">
            <button type="button" class="btn btn-light-primary addBtn w-100" (click)="addContact()">
              <i class="fa-solid fa-plus fs-3"></i>
              اضافة
            </button>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-15">حفظ</button>
      </div>
    </form>

  </div>
</div>
<swal #successSwal [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم الاضافة بنجاح!"
  text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>
<swal #successSwal3 [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم التحميل بنجاح!"
  text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>
<swal #successSwal2 [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم الحذف بنجاح!"
  text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>
<swal #deleteSwal [swalOptions]="swalOptions" title="حدث خطأ!" icon="error"
  [customClass]="{confirmButton: 'btn btn-danger'}" [showCancelButton]="false">
</swal>
