<section class="card mb-12">
  <div class="card-header border-0 pt-5 px-10">
    <div class="card-title m-0 align-items-start flex-column">
      <span class="mb-3 text-gray-900 fs-3">
        الأسئلة الأكثر شيوعا
      </span>
    </div>
  </div>
  <div class="card-body border-0 p-9">
    <form class="form" [formGroup]="FaqFormGroup" (ngSubmit)="submitForm()">
      <div class="col-lg-12 fv-row mb-8">
        <!-- <label for="que" class="mb-2 text-gray-600"> السؤال (اللغه العربيه) </label> -->
        <input id="que" formControlName="titleAr" type="text" class="form-control form-control-lg" placeholder="العنوان"
          name="name" />
        <div *ngIf="FaqFormGroup.get('titleAr')?.invalid && FaqFormGroup.get('titleAr')?.touched" class="text-danger">
          <small *ngIf="titleAr?.hasError('required')">
            برجاء ادخال السؤال
          </small>
          <!-- <small *ngIf="titleAr?.hasError('englishNotAllowed')">
            برجاء ادخال السؤال باللغة العربية
          </small> -->
        </div>
      </div>
      <div class="mb-8 col-lg-12 fv-row">
        <p-editor formControlName="descriptionAr" [style]="{ height: '320px'}" />
        <div *ngIf="FaqFormGroup.get('descriptionAr')?.invalid && FaqFormGroup.get('descriptionAr')?.touched"
          class="text-danger">
          <small *ngIf="FaqFormGroup.get('descriptionAr')?.hasError('required')">
            برجاء ادخال وصف السؤال
          </small>
        </div>
      </div>
      <!-- <div class="col-lg-12 fv-row mb-8">
        <label for="que" class="mb-2 text-gray-600"> السؤال (اللغه الانجليزية) </label>
        <input id="que" type="text" (keydown)="blockArabicLetters($event)" formControlName="titleEn"
          class="form-control form-control-lg" placeholder="العنوان" name="name" />
        <div *ngIf="FaqFormGroup.get('titleEn')?.invalid && FaqFormGroup.get('titleEn')?.touched" class="text-danger">
          <small *ngIf="titleEn?.hasError('required')">
            برجاء ادخال السؤال
          </small>
          <small *ngIf="titleEn?.hasError('arabicNotAllowed')">
            برجاء ادخال السؤال باللغة الانجليزية
          </small>
        </div>
      </div>
      <div class="mb-8 col-lg-12 fv-row">
        <p-editor formControlName="descriptionEn" [style]="{ height: '320px'}" />
        <div *ngIf="FaqFormGroup.get('descriptionEn')?.invalid && FaqFormGroup.get('descriptionEn')?.touched"
          class="text-danger">
          <small *ngIf="FaqFormGroup.get('descriptionEn')?.hasError('required')">
            برجاء ادخال وصف السؤال
          </small>
        </div>
      </div> -->
      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-15">
          {{ isEditMode ? 'تحديث' : 'حفظ' }}
        </button>

      </div>
    </form>
  </div>
</section>
<section class="card mb-12">
  <div class="card-body d-flex flex-column justify-content-end p-9">
    <app-cards-widget20 [data]="allFAQ" (deleteEvent)="deleteFAQ($event)"
      (editEvent)="editData($event)"></app-cards-widget20>
  </div>
</section>
<swal #successSwal [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم الاضافة بنجاح!"
  text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>
<swal #deleteSwal [swalOptions]="swalOptions" title="حدث خطأ!" icon="error"
  [customClass]="{confirmButton: 'btn btn-danger'}" [showCancelButton]="false">
</swal>
