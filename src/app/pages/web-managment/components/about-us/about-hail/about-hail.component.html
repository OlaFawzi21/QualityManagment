<div class="card border-0">

  <div class="card-body p-4">
    <form class="form mb-10" [formGroup]="abouHailForm" (ngSubmit)="updateAboutHail()">
      <div class="col-lg-12 fv-row mb-8">
        <!-- <label for="que" class="mb-2 text-gray-600"> المصطلح (اللغه العربيه) </label> -->
        <input id="que" formControlName="titleAr" type="text" class="form-control form-control-lg" placeholder="العنوان"
          name="titleAr" />
        <div *ngIf="abouHailForm.get('titleAr')?.invalid && abouHailForm.get('titleAr')?.touched" class="text-danger">
          <small *ngIf="titleAr?.hasError('required')">
            برجاء ادخال المصطلح
          </small>
        </div>
      </div>
      <div class="mb-8 col-lg-12 fv-row">
        <p-editor formControlName="descriptionAr" [style]="{ height: '320px'}" />
        <div *ngIf="abouHailForm.get('descriptionAr')?.invalid && abouHailForm.get('descriptionAr')?.touched"
          class="text-danger">
          <small *ngIf="abouHailForm.get('descriptionAr')?.hasError('required')">
            برجاء ادخال وصف المصطلح
          </small>
        </div>
      </div>
      <div class="my-8 ">
        <div class="mb-6 position-relative">
          <input type="file" class="form-control form-control-lg file1" [ngClass]="{ 'text-white': !isFileSelected1 }"
            [ngClass]="{ 'text-white': isFileSelected1 }" (change)="onFileSelected1($event)" accept=".jpg, .jpeg, .png, .webp, .svg">
          <span class="span-pic fs-5" *ngIf="!isFileSelected1">إرفاق صورة</span>
          <span class="span-pic fs-5" *ngIf="isFileSelected1">{{imageName}}</span>
        </div>
        <div class="my-3" *ngIf="abouHail.image">
          <img [src]="assets+abouHail.image" alt="الصورة المحملة" class="img-thumbnail" width="250">
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-15">حفظ</button>
      </div>
    </form>

  </div>
</div>
<swal #successSwal [swalOptions]="{ showCancelButton: false, confirmButtonText: 'موافق' }" title="تم التعديل بنجاح!"
  text="" icon="success" [customClass]="{confirmButton: 'btn btn-primary'}">
</swal>
<swal #deleteSwal [swalOptions]="swalOptions" title="حدث خطأ!" icon="error"
  [customClass]="{confirmButton: 'btn btn-danger'}" [showCancelButton]="false">
</swal>
