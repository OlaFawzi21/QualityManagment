<div class="card border-0">


  <div class="card-body border-0 p-4">
    <form [formGroup]="formGroup">
      <div class="my-3">
        <input type="text" class="form-control" placeholder="المزار">
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="3" placeholder="الوصف التعريفي"></textarea>
      </div>
      <div class="d-flex flex-wrap gap-12 align-items-center my-8">
        <p class="text-gray-600 fs-4 m-0">نوع المزار</p>
        <div class="d-flex gap-12">
          <div *ngFor="let type of siteTypes" class="field-checkbox d-flex gap-3">
            <p-radioButton [value]="type.label" formControlName="selectedType" />
            <img [src]="type?.icon" class="px-2" width="30" alt="type.label">
            <label class="fs-5 text-gray-600">
              {{ type.label }}
            </label>
          </div>
        </div>
      </div>
    </form>


    <div class="d-flex justify-content-end">
      <button class="btn btn-primary px-15">حفظ</button>
    </div>
  </div>
</div>
