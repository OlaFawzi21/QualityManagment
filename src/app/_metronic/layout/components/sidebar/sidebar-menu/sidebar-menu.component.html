<!--begin::Menu wrapper-->
<div id="kt_app_sidebar_menu_scroll" class="scroll-y my-5 mx-3" data-kt-scroll="true" data-kt-scroll-activate="true"
  data-kt-scroll-height="auto" data-kt-scroll-dependencies="#kt_app_sidebar_logo, #kt_app_sidebar_footer"
  data-kt-scroll-wrappers="#kt_app_sidebar_menu" data-kt-scroll-offset="5px" data-kt-scroll-save-state="true">
  <!--begin::Menu-->
  <div *ngIf="userRole==='Admin'" class="menu menu-column menu-rounded menu-sub-indention fw-semibold fs-6"
    id="#kt_app_sidebar_menu" data-kt-menu="true" data-kt-menu-expand="false">
    <div class="menu-item">
      <a class="menu-link without-sub" routerLinkActive='active' style="padding-right: 0px !important;"
        routerLink="/dashboard">
        <span class="menu-icon">
          <img width="26" height="26"
            [src]="getIcon('/dashboard', '../../../../../../assets/images/icons/smart-home-active.svg', '../../../../../../assets/images/icons/smart-home.svg')"
            alt="">
        </span>
        <span class="menu-title mx-2">
          لوحة التحكم
        </span>
      </a>
    </div>

    <!-- Users -->
    <div class="menu-item">
      <a class="menu-link without-sub" routerLinkActive='active' style="padding-right: 0px !important;"
        routerLink="/users">
        <span class="menu-icon">
          <img width="26" height="26"

            alt="">
        </span>
        <span class="menu-title mx-2">
          المستخدمين

      </a>

        </span>
        <span class="menu-title mx-2">

    </div> -->

        <span class="menu-icon">
          <img width="26" height="26"
