<form class="form w-100" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form"
  (ngSubmit)="submit()">

  <div class="login-title text-center mb-11">
    <img src="../../../../../assets/images/logo/logo-ar.svg" alt="logo">
    <p class="text-gray-900 fw-semibold my-15 fs-2">تسجيل الدخول</p>
  </div>

  <div class="fv-row mb-12 position-relative">
    <div class="input-group">
      <span class="input-group-text" id="basic-addon2">
        <img src="../../../../../assets/images/icons/solar_user-linear.svg" alt="email">
      </span>
      <input class="rounded-t-b-left form-control" type="email" name="email" formControlName="email" autocomplete="off"
        aria-describedby="basic-addon2" placeholder="البريد الإلكتروني" />
    </div>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'برجاء اخال البريد الإلكتروني',
        control: loginForm.controls['email']
      }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'email',
        message: 'البريد الإلكتروني غير صحيح',
        control: loginForm.controls['email']
      }"></ng-container>
  </div>

  <div class="fv-row mb-10 position-relative">
    <div class="input-group">
      <span class="input-group-text" id="basic-addon1">
        <img src="../../../../../assets/images/icons/lock.svg" alt="password">
      </span>
      <input [type]="isHide ? 'password' : 'text'" id="password" name="password" formControlName="password"
        class="border-left-0 border-right-0 form-control" aria-describedby="basic-addon1" placeholder="كلمة المرور" />
      <a class="input-group-text" (click)="togglePasswordVisibility()">
        <i [class]="isHide ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
      </a>
    </div>

    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'برجاء ادخال كلمة المرور',
        control: loginForm.controls['password']
      }"></ng-container>
    
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'pattern',
        message: 'يجب أن تحتوي كلمة المرور على 8 أحرف على الأقل بما في ذلك حرف كبير وحرف صغير ورمز',
        control: loginForm.controls['password']
      }"></ng-container>

  </div>

  <div class="d-flex flex-wrap justify-content-between">
    <div>
      <p-checkbox [binary]="true" inputId="binary" />
      <label class="form-check-label text-gray-900 ms-4">
        تذكرنى دائما
      </label>
    </div>

    <a routerLink="/auth/forgot-password" class="link-primary">
      هل نسيت كلمه المرور ؟
    </a>
  </div>

  <div class="d-grid login-btn my-10">
    <button type="submit" id="kt_sign_in_submit" class="btn btn-primary" [disabled]="loginForm.invalid">
      <ng-container *ngIf="isLoading">
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </ng-container>
      <ng-container>
        <span class="indicator-label">تسجيل الدخول</span>
      </ng-container>
    </button>
  </div>

</form>



<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched && control.errors)">
    <div class="fv-plugins-message-container">
      <span class="text-danger" role="alert">
        {{ message }}
      </span>
    </div>
  </ng-container>
</ng-template>
